[project]
name = "sherox"
version = "0.9.0"
description = "SHErpa OnnX toolkit — streaming ASR, VAD segmentation, and TTS"
requires-python = ">=3.11"
dependencies = [
    "sherpa-onnx>=1.12.28",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "numpy>=2.2.6",
    "rich>=13.0.0",
    "scipy>=1.10.0",
    "audiokit",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
"sherox"         = "sherox.main:main"
"sherox.asr"     = "sherox.asr:main"
"sherox.sid"     = "sherox.sid:main"
"sherox.lid"     = "sherox.lid:main"
"sherox.segment" = "sherox.segment:main"
"sherox.tts"     = "sherox.tts:main"
"sherox.kws"     = "sherox.kws:main"
"sherox.wake"    = "sherox.wake:main"
"sherox.server"  = "sherox.server:main"
"sherox.tts_server" = "sherox.tts_server:main"
"sherox.asr_server" = "sherox.asr_server:main"
"sherox.models"  = "sherox.models:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "editdistance>=0.6.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0.0",
]
tts-ja = [
    "piper-plus",
]
denoise = [
    "noisereduce>=3.0",
]
wake = [
    "livekit-wakeword>=0.2.0",
]
benchmark = [
    "soxr>=0.3.0",
    "editdistance>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sherox*"]

[tool.setuptools.package-data]
sherox = ["assets/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Shared audio plumbing (resampling, safe tar extraction). For local development,
# you can override with: audiokit = { path = "../audiokit", editable = true }
audiokit = { git = "https://github.com/bagustris/audiokit.git" }
