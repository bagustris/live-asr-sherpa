[project]
name = "sherox"
version = "0.9.0"
description = "SHErpa OnnX toolkit — streaming ASR, VAD segmentation, and TTS"
requires-python = ">=3.11"
dependencies = [
    "sherpa-onnx>=1.12.28",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "numpy>=2.2.6",
    "rich>=13.0.0",
    "scipy>=1.10.0",
    "audiokit",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
"sherox"         = "sherox.main:main"
"sherox.asr"     = "sherox.asr:main"
"sherox.sid"     = "sherox.sid:main"
"sherox.lid"     = "sherox.lid:main"
"sherox.segment" = "sherox.segment:main"
"sherox.tts"     = "sherox.tts:main"
"sherox.sarashina_onnx_export" = "sherox.sarashina_onnx_export:main"
"sherox.sarashina_onnx_hf" = "sherox.sarashina_onnx_hf:main"
"sherox.kws"     = "sherox.kws:main"
"sherox.wake"    = "sherox.wake:main"
"sherox.server"  = "sherox.server:main"
"sherox.tts_server" = "sherox.tts_server:main"
"sherox.asr_server" = "sherox.asr_server:main"
"sherox.models"  = "sherox.models:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "editdistance>=0.6.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0.0",
]
tts-ja = [
    "piper-plus",
]
tts-ja-sarashina = [
    # torch/torchaudio are sourced from the pytorch-cpu index (see [tool.uv.sources]).
    # With plain pip, pre-install CPU torch first:
    #   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
    "sarashina2.2-tts @ git+https://github.com/sbintuitions/sarashina2.2-tts.git",
]
# jpn-sarashina-onnx backend, including zero-shot voice cloning. Runtime needs
# only onnxruntime + onnxruntime-genai + huggingface_hub (no torch).
# audiokit (a core sherox dep) supplies resampling; numpy/scipy provide mel
# filterbank computation. The ONNX artifacts auto-download on first use from
# https://huggingface.co/Bagus/Sarashina2.2-TTS-ONNX. Re-exporting them
# yourself from the original checkpoint (e.g. after a model update) needs the
# tts-ja-sarashina extra (torch) plus onnx/onnxscript below — see
# sherox/sarashina_onnx_export.py.
tts-ja-sarashina-onnx = [
    "onnxruntime>=1.20.0",
    "onnxruntime-genai>=0.14.0",
    "huggingface_hub>=0.24.0",
]
tts-ja-sarashina-onnx-export = [
    "sherox[tts-ja-sarashina,tts-ja-sarashina-onnx]",
    "onnx>=1.17.0",
    "onnxscript>=0.7.0",
    "onnx-ir>=0.2.0",
]
denoise = [
    "noisereduce>=3.0",
]
wake = [
    "livekit-wakeword>=0.2.0",
]
benchmark = [
    "soxr>=0.3.0",
    "editdistance>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sherox*"]

[tool.setuptools.package-data]
sherox = ["assets/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── uv: pull torch/torchaudio from the CPU-only wheel index ──────────────────
# This prevents uv from resolving CUDA-enabled torch from PyPI when the
# tts-ja-sarashina extra (sarashina2.2-tts) pulls in torch as a dependency.
# GPU users: change the url to https://download.pytorch.org/whl/cu<version>
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
# Shared audio plumbing (resampling, safe tar extraction). For local development,
# you can override with: audiokit = { path = "../audiokit", editable = true }
audiokit = { git = "https://github.com/bagustris/audiokit.git" }
