[project]
name = "sherox"
version = "0.2.0"
description = "SHErpa OnnX toolkit — streaming ASR, VAD segmentation, and TTS"
requires-python = ">=3.11"
dependencies = [
    "sherpa-onnx>=1.12.28",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "numpy>=2.2.6",
    "rich>=13.0.0",
]

[project.scripts]
"sherox.asr"     = "sherox.asr:main"
"sherox.sid"     = "sherox.sid:main"
"sherox.segment" = "sherox.segment:main"
"sherox.tts"     = "sherox.tts:main"
"sherox.server"  = "sherox.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "editdistance>=0.6.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0.0",
]
tts-ja = [
    "piper-plus",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sherox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
